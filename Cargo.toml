[workspace]
members = [
  "crates/bornera-core",
  "crates/bornera",
  "crates/bornera-rustls",
  "crates/bornera-sim",
]
resolver = "3"

[workspace.package]
version = "0.0.1-rc.3"
edition = "2024"
rust-version = "1.88"
authors = ["zsumz <shawn@zsumz.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/zsumz/bornera"
homepage = "https://github.com/zsumz/bornera"

[workspace.dependencies]
bytebudget = "=0.0.1-rc.1"
bytes = "1.11.1"
calandria = { version = "=0.0.1-rc.2", default-features = false }
calandria-mio = { version = "=0.0.1-rc.2" }
calandria-sim = { version = "=0.0.1-rc.2" }
bornera-core = { version = "=0.0.1-rc.3", path = "crates/bornera-core" }
bornera = { version = "=0.0.1-rc.3", path = "crates/bornera" }
mio = { version = "1.2.2", default-features = false, features = ["net"] }
rcgen = { version = "=0.14.8", default-features = false, features = ["ring"] }
# TLS 1.2 support is deliberate for Kafka-compatible consumers; the supplied
# ClientConfig remains responsible for the protocol versions enabled at runtime.
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
