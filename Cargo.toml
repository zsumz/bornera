[workspace]
members = [
  "crates/bornera-core",
  "crates/bornera",
  "crates/bornera-sim",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
authors = ["zsumz <shawn@zsumz.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/zsumz/bornera"
homepage = "https://github.com/zsumz/bornera"

[workspace.dependencies]
bytes = "1.11.1"
calandria = { version = "=0.0.1-rc.1", default-features = false }
calandria-mio = { version = "=0.0.1-rc.1" }
bornera-core = { version = "=0.0.1", path = "crates/bornera-core" }
mio = { version = "1.2.2", default-features = false, features = ["net"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
