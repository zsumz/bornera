name: qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  canonical-msrv:
    name: MSRV 1.88 canonical gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.88.0
      - run: cargo +stable install zcheck --version 0.0.1 --locked
      - run: cargo +stable install zrail --version 0.0.3-rc.4 --locked
      - run: cargo fetch --locked
      - run: zcheck

  latest-stable:
    name: Latest stable tests and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable test --workspace --all-features --locked
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings

  portable:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --workspace --all-features --locked

  packages:
    name: Package contents and smoke compilation
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo fetch --locked
      - run: ./scripts/package-proof.sh

  supply-chain:
    name: Advisories, licenses, bans, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install cargo-deny --version 0.20.2 --locked
      - run: cargo +stable deny check

  miri:
    name: Selected deterministic owner tests under Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly-2026-08-01 --profile minimal --component miri
      - run: cargo +nightly-2026-08-01 miri setup
      - run: cargo +nightly-2026-08-01 miri test -p bornera-core --test frame_contract --locked
      - run: cargo +nightly-2026-08-01 miri test -p bornera-core --test completion --locked
      - run: cargo +nightly-2026-08-01 miri test -p bornera-core --test commit_order --locked

  coverage:
    name: Workspace coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - run: cargo +stable install cargo-llvm-cov --version 0.8.7 --locked
      - run: cargo +stable llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - run: cargo +stable llvm-cov report --locked --summary-only
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
