adapters = ["rust"]
schema = 1

[dependencies]
cycles = "deny"
mode = "locked"
unassigned_packages = "deny"

[[dependencies.crate_root]]
package = "bytebudget"
reason = "The published bytebudget package provides exact aggregate accounting for bounded retained storage."
root = "bytebudget"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=0.0.1-rc.1"

[[dependencies.crate_root]]
package = "calandria"
reason = "The published Calandria package exposes the calandria library root."
root = "calandria"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=0.0.1-rc.2"

[[dependencies.crate_root]]
package = "calandria-mio"
reason = "The published calandria-mio package exposes the calandria_mio library root."
root = "calandria_mio"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=0.0.1-rc.2"

[[dependencies.crate_root]]
package = "calandria-sim"
reason = "The published calandria-sim package exposes the calandria_sim library root."
root = "calandria_sim"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=0.0.1-rc.2"

[[dependencies.crate_root]]
package = "mio"
reason = "The published Mio package exposes the mio library root used for private TCP sources."
root = "mio"

[dependencies.crate_root.source]
kind = "registry"
requirement = "1.2.2"

[[dependencies.crate_root]]
package = "rcgen"
reason = "The published rcgen package provides ephemeral TLS identities for loopback qualification."
root = "rcgen"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=0.14.8"

[[dependencies.crate_root]]
package = "rustls"
reason = "The published rustls package provides the bounded generic TLS client transport."
root = "rustls"

[dependencies.crate_root.source]
kind = "registry"
requirement = "=0.23.43"

[[dependencies.crate_root]]
package = "socket2"
reason = "The published socket2 package exposes the socket2 library root used for TCP policy."
root = "socket2"

[dependencies.crate_root.source]
kind = "registry"
requirement = "0.6.5"

[[dependency]]
deny = [
    "bornera",
    "bornera-rustls",
    "bornera-sim",
]
from = "bornera-core"
name = "core-does-not-depend-outward"
reason = "The deterministic core cannot depend on either adapter package."

[[layer]]
may_depend_on = []
name = "core"
packages = ["bornera-core"]
reason = "Deterministic connection policy remains below production and simulation adapters."

[layer.dependencies]
external = "locked"

[[layer]]
may_depend_on = ["core"]
name = "production"
packages = ["bornera"]
reason = "The native duty interprets deterministic core policy through Calandria and private Mio capabilities."

[layer.dependencies]
external = "locked"

[[layer]]
may_depend_on = [
    "core",
    "production",
]
name = "simulation"
packages = ["bornera-sim"]
reason = "Deterministic replay drives the production selector-free connection slot through simulated Calandria time and transport capabilities."

[layer.dependencies]
external = "locked"

[[layer]]
may_depend_on = [
    "core",
    "production",
]
name = "tls-adapter"
packages = ["bornera-rustls"]
reason = "The optional TLS package provides a bounded client transport and a socket-free server session for external owners."

[layer.dependencies]
external = "locked"

[repository]
exclude = []
nested_git = "deny"
roots = [
    "crates/bornera",
    "crates/bornera-core",
    "crates/bornera-rustls",
    "crates/bornera-sim",
]
submodules = "deny"
symlinks = "inside"
workspace_members = "exact"

[[scope]]
include = ["crates/bornera-core/src/**"]
name = "core-sans-io-protocol-neutral"
reason = "Core owns data-only connection policy without transport acquisition or protocol meaning."

[scope.symbols]
deny = [
    "calandria_mio",
    "mio",
    "tokio",
    "std::net",
    "std::process",
    "std::sync::Mutex",
    "std::sync::RwLock",
    "std::thread",
]

[[scope]]
include = ["crates/bornera-sim/src/**"]
name = "simulation-does-not-acquire-production-io"
reason = "Simulation scripts deterministic capabilities rather than acquiring sockets or selectors."

[scope.symbols]
deny = [
    "calandria_mio",
    "mio",
    "tokio",
    "std::net",
    "std::process",
    "std::thread",
]

[[scope]]
include = ["crates/bornera/src/**"]
name = "production-remains-native-runtime-neutral"
reason = "Production privately owns Mio TCP while Calandria remains the sole execution and hosting authority."

[scope.symbols]
deny = [
    "tokio",
    "tower",
    "std::thread",
    "std::time::Instant",
]

[[scope]]
include = [
    "crates/bornera-rustls/src/client_config.rs",
    "crates/bornera-rustls/src/client_io.rs",
    "crates/bornera-rustls/src/client_session.rs",
    "crates/bornera-rustls/src/client_status.rs",
    "crates/bornera-rustls/src/server_config.rs",
    "crates/bornera-rustls/src/server_io.rs",
    "crates/bornera-rustls/src/server_session.rs",
    "crates/bornera-rustls/src/server_status.rs",
]
name = "rustls-sessions-are-socket-free"
reason = "The reusable rustls client and server sessions own protocol state only; their outer runtime retains sockets, clocks, tasks, and readiness."

[scope.symbols]
deny = [
    "calandria_mio",
    "mio",
    "socket2",
    "std::net",
    "std::thread",
    "std::time::Instant",
    "tokio",
]

[source.rust]
entrypoints = "declarative"
facades = "declarative"
module_docs = "required"
tests = "sibling"

[source.rust.hygiene]
deny_macros = [
    "panic",
    "todo",
    "unimplemented",
    "unreachable",
    "dbg",
]
deny_methods = [
    "unwrap",
    "expect",
]
lint_suppressions = "deny"
unsafe = "deny"

[source.rust.macros]
mode = "deny-unreviewed"

[[source.rust.macros.allow]]
name = "Clone"
reason = "Owned data-only values use Rust's built-in Clone derive."

[[source.rust.macros.allow]]
name = "Copy"
reason = "Fixed-width identities and snapshots use Rust's built-in Copy derive."

[[source.rust.macros.allow]]
name = "Debug"
reason = "Public policy values expose deterministic diagnostic formatting."

[[source.rust.macros.allow]]
name = "Eq"
reason = "Deterministic policy values use exact equality."

[[source.rust.macros.allow]]
name = "Hash"
reason = "Domain identities support identity-keyed bounded owners."

[[source.rust.macros.allow]]
name = "Ord"
reason = "Fixed-width identities expose total ordering without cross-domain conversion."

[[source.rust.macros.allow]]
name = "PartialEq"
reason = "Public policy values and tests use exact comparison."

[[source.rust.macros.allow]]
name = "PartialOrd"
reason = "Fixed-width identities expose partial ordering within one domain."

[[source.rust.macros.allow]]
name = "assert"
reason = "Focused integration tests assert deterministic transition predicates."

[[source.rust.macros.allow]]
name = "assert_eq"
reason = "Focused integration tests compare deterministic values and effects."

[[source.rust.macros.allow]]
name = "matches"
reason = "State transitions and tests use Rust's standard pattern predicate."

[source.rust.size.auxiliary]
hard = 300
target = 300

[source.rust.size.facade]
hard = 120
target = 80

[source.rust.size.implementation]
hard = 300
target = 240

[source.rust.size.test]
hard = 300
target = 300
